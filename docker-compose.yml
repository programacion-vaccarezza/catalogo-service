services:
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - catalogo_postgres_data:/var/lib/postgresql/data

volumes:
  catalogo_postgres_data: