services:
  catalogo-db:
    image: postgres:16
    container_name: catalogo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "${CATALOGO_DB_PORT}:5432"
    volumes:
      - catalogo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGO_DB_USER} -d ${CATALOGO_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalogo-service:
    build: .
    container_name: catalogo-service
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://catalogo-db:5432/${CATALOGO_DB_NAME}
      DB_USERNAME: ${CATALOGO_DB_USER}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      TZ: America/Argentina/Mendoza
    ports:
      - "8080:8080"
    depends_on:
      catalogo-db:
        condition: service_healthy

volumes:
  catalogo-db-data:
