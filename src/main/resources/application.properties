spring.application.name=catalogo-service
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

service.client-id=${SERVICE_CLIENT_ID}
service.client-secret=${SERVICE_CLIENT_SECRET}
service.jwt-secret=${SERVICE_JWT_SECRET}
service.jwt-expiration=${SERVICE_JWT_EXPIRATION}

catedra.base-url=${CATEDRA_BASE_URL}
catedra.jwt=${CATEDRA_JWT}
catedra.group-id=${CATEDRA_GROUP_ID}
catedra.redis.host=${CATEDRA_REDIS_HOST}
catedra.redis.port=${CATEDRA_REDIS_PORT}
catedra.redis.username=${CATEDRA_REDIS_USERNAME}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD}
catedra.redis.read-namespace=${CATEDRA_REDIS_READ_NAMESPACE}
catedra.kafka.catalog-topic=${CATEDRA_KAFKA_CATALOG_TOPIC}

spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.catalogo_service.sync.infrastructure.messaging.dto.CatalogUpdatedEventDto
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.catalogo_service.sync.infrastructure.messaging.dto

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
